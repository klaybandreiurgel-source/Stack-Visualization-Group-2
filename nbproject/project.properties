# Project Information
application.title=Stack-Visualization-Group-2
application.vendor=Group 2

# Source and Build Directories
src.dir=src
build.dir=build
build.classes.dir=${build.dir}/classes
build.generated.dir=${build.dir}/generated
build.generated.sources.dir=${build.dir}/generated-sources
build.test.classes.dir=${build.dir}/test/classes
build.test.results.dir=${build.dir}/test/results
dist.dir=dist
dist.jar=${dist.dir}/Stack-Visualization-Group-2.jar

# Java Compiler Settings
javac.source=17
javac.target=17
javac.debug=true
javac.deprecation=false
javac.compilerargs=
javac.classpath=
javac.modulepath=
javac.processorpath=
javac.test.classpath=${javac.classpath}:${build.classes.dir}
javac.test.modulepath=
javac.test.processorpath=

# Java Runtime Settings
run.classpath=${javac.classpath}:${build.classes.dir}
run.modulepath=
run.jvmargs=
main.class=StackVisualizerGUI

# Manifest
manifest.file=manifest.mf

# Build Settings
build.classes.excludes=**/*.java,**/*.form
dist.javadoc.dir=${dist.dir}/javadoc
includes=**
excludes=
jar.compress=false
jar.index=${jar.compress}
jar.archive.disabled=${jnlp.enabled}

# Javadoc
javadoc.author=false
javadoc.version=false
javadoc.use=true
javadoc.windowtitle=
javadoc.additionalparam=
